<!doctype html>
<meta charset="utf-8">
<title>Prova scanner (fogli inventati)</title>
<body>
<script src="/pkg/jscanify/package/src/opencv.js"></script>
<script src="/pkg/jscanify/package/src/jscanify.js"></script>
<script type="module">
import { Scanner, scanDocument, extractDocument, createCornerEditor } from '/pkg/scanic/package/dist/scanic.js';

// ---------- generatore pseudo-casuale ripetibile ----------
let seed = 42;
const rnd = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };

// ---------- foglio inventato ----------
function makeSheet(kind) {
  const receipt = kind === 'scontrino';
  const w = receipt ? 600 : 1240, h = receipt ? 1800 : 1754;
  const c = new OffscreenCanvas(w, h), g = c.getContext('2d');
  g.fillStyle = receipt ? '#f3eedd' : '#fbfbf8'; g.fillRect(0, 0, w, h);
  g.fillStyle = '#222';
  g.font = `bold ${receipt ? 34 : 48}px sans-serif`;
  g.fillText(receipt ? 'SCONTRINO DI PROVA' : 'Contabile di bonifico — PROVA', 60, 110);
  g.font = `${receipt ? 24 : 30}px sans-serif`;
  const righe = ['Ordinante: Mario Rossi (inventato)', 'Beneficiario: Agenzia Esempio', 'IBAN: IT00 X000 0000 0000 0000 0000 000',
    'Causale: canone di prova, mese inventato', 'Importo: 650,00 €', 'Data: 01/11/2026', 'Numero operazione: 0000-PROVA-0000'];
  let y = 200;
  for (let i = 0; i < (receipt ? 40 : 30); i++) {
    const t = righe[i % righe.length];
    g.fillText(t, 60, y); y += receipt ? 40 : 48;
  }
  g.strokeStyle = '#444'; g.lineWidth = 3; g.strokeRect(50, h - 260, w - 100, 180);
  return c;
}

// ---------- sfondi ----------
function background(g, W, H, kind) {
  if (kind === 'legno') {
    for (let x = 0; x < W; x += 4) { const v = 60 + 25 * Math.sin(x / 37) + 15 * Math.sin(x / 7.3); g.fillStyle = `rgb(${v + 40},${v + 15},${v - 10})`; g.fillRect(x, 0, 4, H); }
  } else if (kind === 'chiaro') {
    g.fillStyle = '#e6e3dc'; g.fillRect(0, 0, W, H);
  } else if (kind === 'righe') {
    g.fillStyle = '#c8cfe0'; g.fillRect(0, 0, W, H);
    for (let x = 0; x < W + H; x += 60) { g.fillStyle = (x / 60) % 2 ? '#3a4f7a' : '#c8cfe0'; g.beginPath(); g.moveTo(x, 0); g.lineTo(x + 30, 0); g.lineTo(x + 30 - H, H); g.lineTo(x - H, H); g.fill(); }
  } else if (kind === 'grigio') {
    g.fillStyle = '#8a8d90'; g.fillRect(0, 0, W, H);
  } else if (kind === 'scrivania') {
    g.fillStyle = '#5b6066'; g.fillRect(0, 0, W, H);
    g.fillStyle = '#1b1b1b'; g.fillRect(W * 0.02, H * 0.05, W * 0.18, H * 0.35);      // telefono
    g.fillStyle = '#f2f2f2'; g.fillRect(W * 0.78, H * 0.6, W * 0.2, H * 0.3);        // busta bianca
    g.fillStyle = '#c33'; g.fillRect(W * 0.1, H * 0.85, W * 0.5, H * 0.02);          // penna
    g.fillStyle = '#d9c9a0'; g.beginPath(); g.arc(W * 0.85, H * 0.15, W * 0.08, 0, 7); g.fill(); // tazza
  }
}

// ---------- omografia ----------
function homography(src, dst) { // 4 punti -> matrice 3x3 (src->dst)
  const A = [], b = [];
  for (let i = 0; i < 4; i++) {
    const [x, y] = src[i], [u, v] = dst[i];
    A.push([x, y, 1, 0, 0, 0, -u * x, -u * y]); b.push(u);
    A.push([0, 0, 0, x, y, 1, -v * x, -v * y]); b.push(v);
  }
  for (let i = 0; i < 8; i++) { // Gauss
    let p = i; for (let r = i + 1; r < 8; r++) if (Math.abs(A[r][i]) > Math.abs(A[p][i])) p = r;
    [A[i], A[p]] = [A[p], A[i]]; [b[i], b[p]] = [b[p], b[i]];
    for (let r = 0; r < 8; r++) if (r !== i) { const f = A[r][i] / A[i][i]; for (let c = i; c < 8; c++) A[r][c] -= f * A[i][c]; b[r] -= f * b[i]; }
  }
  const h = b.map((v, i) => v / A[i][i]); return [...h, 1];
}

// ---------- scena: foglio in prospettiva su sfondo ----------
function makeScene(cs, W, H) {
  seed = cs.seed;
  const scene = new OffscreenCanvas(W, H), g = scene.getContext('2d');
  background(g, W, H, cs.bg);
  const sheet = makeSheet(cs.sheet), sw = sheet.width, sh = sheet.height;
  const sd = sheet.getContext('2d').getImageData(0, 0, sw, sh).data;
  const quad = cs.quad.map(([x, y]) => [x * W, y * H]); // TL TR BR BL
  const Hinv = homography(quad, [[0, 0], [sw, 0], [sw, sh], [0, sh]]);
  const img = g.getImageData(0, 0, W, H), d = img.data;
  const xs = quad.map(p => p[0]), ys = quad.map(p => p[1]);
  const x0 = Math.max(0, Math.floor(Math.min(...xs))), x1 = Math.min(W - 1, Math.ceil(Math.max(...xs)));
  const y0 = Math.max(0, Math.floor(Math.min(...ys))), y1 = Math.min(H - 1, Math.ceil(Math.max(...ys)));
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
    const z = Hinv[6] * x + Hinv[7] * y + 1, u = (Hinv[0] * x + Hinv[1] * y + Hinv[2]) / z, v = (Hinv[3] * x + Hinv[4] * y + Hinv[5]) / z;
    if (u < 0 || v < 0 || u >= sw - 1 || v >= sh - 1) continue;
    const si = ((v | 0) * sw + (u | 0)) * 4, di = (y * W + x) * 4;
    let k = 1;
    if (cs.fold) { // piega: metà destra più scura e una linea
      const t = u / sw; if (t > 0.5) k = 0.86; if (Math.abs(t - 0.5) < 0.004) k = 0.7;
    }
    d[di] = sd[si] * k; d[di + 1] = sd[si + 1] * k; d[di + 2] = sd[si + 2] * k; d[di + 3] = 255;
  }
  // luce: sfumatura, eventuale ombra morbida, rumore
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const i = (y * W + x) * 4;
    let k = 1 - cs.grad * (x / W) * 0.6 - cs.grad * (y / H) * 0.4;
    if (cs.shadow) { const dx = (x / W - cs.shadow[0]) / cs.shadow[2], dy = (y / H - cs.shadow[1]) / cs.shadow[2]; k *= 1 - 0.45 * Math.exp(-(dx * dx + dy * dy)); }
    const n = (rnd() - 0.5) * 18;
    d[i] = Math.max(0, Math.min(255, d[i] * k + n)); d[i + 1] = Math.max(0, Math.min(255, d[i + 1] * k + n)); d[i + 2] = Math.max(0, Math.min(255, d[i + 2] * k + n));
  }
  g.putImageData(img, 0, 0);
  // leggera sfocatura, come una foto vera
  const out = document.createElement('canvas'); out.width = W; out.height = H;
  const og = out.getContext('2d'); og.drawImage(scene, 0, 0); og.filter = `blur(${Math.max(1, W / 1500)}px)`; og.drawImage(scene, 0, 0); // base nitida sotto: niente cornice scura ai bordi
  return { canvas: out, quad };
}

const CASES = [
  { id: 'legno-leggera', bg: 'legno', sheet: 'a4', quad: [[.18, .14], [.82, .16], [.85, .86], [.15, .84]], grad: .2, seed: 1 },
  { id: 'legno-forte', bg: 'legno', sheet: 'a4', quad: [[.30, .18], [.74, .20], [.92, .90], [.08, .86]], grad: .2, seed: 2 },
  { id: 'tavolo-chiaro', bg: 'chiaro', sheet: 'a4', quad: [[.16, .15], [.80, .12], [.86, .85], [.14, .88]], grad: .25, seed: 3 },
  { id: 'tessuto-righe', bg: 'righe', sheet: 'a4', quad: [[.20, .16], [.83, .18], [.80, .84], [.17, .86]], grad: .1, seed: 4 },
  { id: 'ombra-mano', bg: 'legno', sheet: 'a4', quad: [[.17, .15], [.83, .14], [.84, .86], [.16, .85]], grad: .3, shadow: [.62, .55, .22], seed: 5 },
  { id: 'scontrino-avorio', bg: 'legno', sheet: 'scontrino', quad: [[.36, .08], [.62, .09], [.66, .93], [.33, .92]], grad: .2, seed: 6 },
  { id: 'piegato', bg: 'grigio', sheet: 'a4', quad: [[.15, .14], [.84, .15], [.86, .87], [.13, .86]], grad: .2, fold: true, seed: 7 },
  { id: 'scrivania-oggetti', bg: 'scrivania', sheet: 'a4', quad: [[.26, .18], [.74, .17], [.76, .80], [.24, .82]], grad: .2, seed: 8 },
  { id: 'ruotato', bg: 'legno', sheet: 'a4', quad: [[.62, .10], [.92, .48], [.40, .92], [.10, .52]], grad: .2, seed: 9 },
  { id: 'angolo-fuori', bg: 'legno', sheet: 'a4', quad: [[.10, -.06], [.85, .10], [.88, .88], [.12, .84]], grad: .2, seed: 10 },
];

// ---------- misura ----------
function cornerArr(c) { return c ? [c.topLeft, c.topRight, c.bottomRight, c.bottomLeft].map(p => [p.x, p.y]) : null; }
function errPct(found, truth, W, H) { // minimo su rotazioni e verso, in % della diagonale
  const diag = Math.hypot(W, H); let best = Infinity, bestMax = Infinity;
  for (const dir of [1, -1]) for (let s = 0; s < 4; s++) {
    const ds = truth.map((t, i) => { const f = found[((dir * i + s) % 4 + 4) % 4]; return Math.hypot(f[0] - t[0], f[1] - t[1]); });
    const m = ds.reduce((a, b) => a + b) / 4; if (m < best) { best = m; bestMax = Math.max(...ds); }
  }
  return { mean: 100 * best / diag, max: 100 * bestMax / diag };
}
const median = a => [...a].sort((x, y) => x - y)[a.length >> 1];
async function timeIt(fn, n = 3) { await fn(); const t = []; for (let i = 0; i < n; i++) { const s = performance.now(); await fn(); t.push(performance.now() - s); } return median(t); }

function jscanifyCorners(canvas) {
  const sc = new jscanify(); const mat = cv.imread(canvas);
  try { const cont = sc.findPaperContour(mat); if (!cont) return null; const p = sc.getCornerPoints(cont); cont.delete();
    if (!p.topLeftCorner || !p.topRightCorner || !p.bottomRightCorner || !p.bottomLeftCorner) return null;
    return [p.topLeftCorner, p.topRightCorner, p.bottomRightCorner, p.bottomLeftCorner].map(q => [q.x, q.y]); }
  finally { mat.delete(); }
}

// ---------- schiarimento nostro: stima della luce e divisione ----------
function schiarisci(src) {
  const W = src.width, H = src.height, g = src.getContext('2d'), img = g.getImageData(0, 0, W, H), d = img.data;
  const s = 16, w = Math.ceil(W / s), h = Math.ceil(H / s), small = new Float32Array(w * h);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) { // massimo locale = carta
    let m = 0; for (let yy = y * s; yy < Math.min(H, y * s + s); yy++) for (let xx = x * s; xx < Math.min(W, x * s + s); xx++) { const i = (yy * W + xx) * 4; const l = (d[i] * 77 + d[i + 1] * 150 + d[i + 2] * 29) >> 8; if (l > m) m = l; }
    small[y * w + x] = m;
  }
  const bl = new Float32Array(w * h), r = 3; // sfocatura a scatola sul fondo stimato
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) { let t = 0, n = 0; for (let yy = Math.max(0, y - r); yy <= Math.min(h - 1, y + r); yy++) for (let xx = Math.max(0, x - r); xx <= Math.min(w - 1, x + r); xx++) { t += small[yy * w + xx]; n++; } bl[y * w + x] = t / n; }
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const i = (y * W + x) * 4, bg = Math.max(40, bl[Math.min(h - 1, (y / s) | 0) * w + Math.min(w - 1, (x / s) | 0)]);
    for (let c = 0; c < 3; c++) { let v = d[i + c] / bg; v = v > 0.92 ? 1 : Math.pow(v / 0.92, 1.6); d[i + c] = 255 * v; }
  }
  const out = document.createElement('canvas'); out.width = W; out.height = H; out.getContext('2d').putImageData(img, 0, 0); return out;
}

window.runAll = async () => {
  const res = [];
  await new Promise(r => { if (window.cv && cv.Mat) r(); else cv.onRuntimeInitialized = r; });
  const scanner = new Scanner(); await scanner.initialize();
  for (const [W, H] of [[1500, 2000], [3000, 4000]]) for (const cs of CASES) {
    const ww = cs.id === 'ruotato' ? H : W, hh = cs.id === 'ruotato' ? W : H;
    const { canvas, quad } = makeScene(cs, ww, hh);
    const truth = quad;
    const r = { caso: cs.id, misura: `${ww}x${hh}` };
    const sr = await scanner.scan(canvas, { mode: 'detect' });
    r.scanic_ok = !!(sr.success && sr.corners); r.scanic_err = r.scanic_ok ? errPct(cornerArr(sr.corners), truth, ww, hh) : null;
    r.scanic_ms = await timeIt(() => scanner.scan(canvas, { mode: 'detect' }));
    if (W === 1500) {
      const jc = jscanifyCorners(canvas); r.jscanify_ok = !!jc; r.jscanify_err = jc ? errPct(jc, truth, ww, hh) : null;
      r.jscanify_ms = await timeIt(() => jscanifyCorners(canvas));
      window.saveImage(`scena-${cs.id}.jpg`, canvas.toDataURL('image/jpeg', 0.7));
      if (r.scanic_ok) {
        const ex = await extractDocument(canvas, sr.corners, { output: 'canvas' });
        window.saveImage(`raddrizzato-${cs.id}.jpg`, ex.output.toDataURL('image/jpeg', 0.8));
        if (['ombra-mano', 'piegato', 'tavolo-chiaro'].includes(cs.id)) {
          const t0 = performance.now(); const sch = schiarisci(ex.output); r.schiarisci_ms = performance.now() - t0;
          window.saveImage(`schiarito-${cs.id}.jpg`, sch.toDataURL('image/jpeg', 0.8));
        }
      }
    } else if (r.scanic_ok) {
      const ex = await timeIt(() => extractDocument(canvas, sr.corners, { output: 'canvas' }), 2); r.extract_ms_12MP = ex;
    }
    res.push(r);
  }
  return res;
};

window.runVideo = async () => {
  const cs = CASES[4]; const { canvas } = makeScene(cs, 1080, 1440);
  const stage = document.createElement('canvas'); stage.width = 1080; stage.height = 1440; const sg = stage.getContext('2d');
  const stream = stage.captureStream(30); const v = document.createElement('video'); v.muted = true; v.playsInline = true; v.srcObject = stream; document.body.append(v);
  let t = 0; const draw = () => { t++; sg.drawImage(canvas, Math.sin(t / 10) * 8, Math.cos(t / 13) * 6); }; draw();
  const iv = setInterval(draw, 33); await v.play(); await new Promise(r => setTimeout(r, 300));
  const scanner = new Scanner(); await scanner.initialize();
  const times = []; let ok = 0;
  for (let i = 0; i < 30; i++) { const s = performance.now(); const r = await scanner.scan(v, { mode: 'detect' }); times.push(performance.now() - s); if (r.success) ok++; await new Promise(r => setTimeout(r, 100)); }
  clearInterval(iv);
  return { fotogrammi: 30, trovati: ok, ms_mediana: median(times), ms_max: Math.max(...times), video: `${v.videoWidth}x${v.videoHeight}` };
};

window.inspectEditor = async () => {
  const { canvas } = makeScene(CASES[0], 750, 1000);
  const img = new Image(); img.src = canvas.toDataURL(); await img.decode();
  const host = document.createElement('div'); host.style.width = '375px'; document.body.append(host);
  const sr = await scanDocument(img, { mode: 'detect' });
  const ed = createCornerEditor({ container: host, image: img, corners: sr.corners, nudges: { enabled: true, steps: [1, 5] } });
  await new Promise(r => setTimeout(r, 200));
  const items = [...host.querySelectorAll('button,[tabindex],[role],[aria-label]')].map(e => ({ tag: e.tagName, role: e.getAttribute('role'), label: e.getAttribute('aria-label') || e.textContent.trim().slice(0, 30), tabindex: e.getAttribute('tabindex'), size: `${Math.round(e.getBoundingClientRect().width)}x${Math.round(e.getBoundingClientRect().height)}` }));
  const h = host.querySelector('[data-corner="topLeft"]'); const before = ed.getCorners().topLeft;
  h.focus(); for (let i = 0; i < 5; i++) h.dispatchEvent(new KeyboardEvent('keydown', { key: 'ArrowRight', bubbles: true }));
  const after = ed.getCorners().topLeft;
  // i nomi si possono cambiare dopo la creazione?
  h.setAttribute('aria-label', 'Angolo in alto a sinistra');
  return { elementi: items, tastiera: { prima: before, dopo: after }, live: host.querySelectorAll('[aria-live]').length };
};
CASES.push({ id: 'ruotato-15', bg: 'legno', sheet: 'a4', quad: [[.26, .10], [.86, .22], [.74, .92], [.14, .80]], grad: .2, seed: 11 });
CASES.push({ id: 'ruotato-15-chiaro', bg: 'chiaro', sheet: 'a4', quad: [[.26, .10], [.86, .22], [.74, .92], [.14, .80]], grad: .25, seed: 12 });
window.runExtra = async () => {
  const out = [];
  for (const cs of CASES) for (const [W, H] of [[1500, 2000], [3000, 4000]]) {
    const ww = cs.id === 'ruotato' ? H : W, hh = cs.id === 'ruotato' ? W : H;
    const { canvas, quad } = makeScene(cs, ww, hh);
    const sr = await scanDocument(canvas, { mode: 'detect' });
    const r = { caso: cs.id, misura: `${ww}x${hh}`, conf: sr.confidence, err: sr.corners ? errPct(cornerArr(sr.corners), quad, ww, hh).max : null };
    // rimpicciolita da noi a 1000 px sul lato lungo, poi angoli riportati alla misura vera
    const k = 1000 / Math.max(ww, hh), sm = document.createElement('canvas'); sm.width = Math.round(ww * k); sm.height = Math.round(hh * k);
    sm.getContext('2d').drawImage(canvas, 0, 0, sm.width, sm.height);
    const s2 = await scanDocument(sm, { mode: 'detect' });
    r.err_ridotta = s2.corners ? errPct(cornerArr(s2.corners).map(([x, y]) => [x / k, y / k]), quad, ww, hh).max : null; r.conf_ridotta = s2.confidence;
    if (W === 1500) { const jc = jscanifyCorners(canvas); r.jscanify = jc ? errPct(jc, quad, ww, hh).max : null; }
    out.push(r);
  }
  return out;
};
window.debugCase =async (id, W, H) => {
  await new Promise(r => { if (window.cv && cv.Mat) r(); else cv.onRuntimeInitialized = r; });
  const cs = CASES.find(c => c.id === id); const { canvas, quad } = makeScene(cs, W, H);
  const sr = await scanDocument(canvas, { mode: 'detect' });
  return { truth: quad.map(p => p.map(Math.round)), scanic: cornerArr(sr.corners).map(p => p.map(Math.round)), jscanify: (jscanifyCorners(canvas) || []).map(p => p.map(Math.round)), canvas: [canvas.width, canvas.height] };
};
window.ready = true;
</script>
